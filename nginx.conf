server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The mock API is a Service Worker (MSW). It must register at scope "/",
    # never be cached, and be served with the JS MIME type. If a stale copy is
    # cached it will intercept requests on old routes and break the app.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
        types { } default_type application/javascript;
    }

    # Hashed build assets are content-addressed, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files (fonts, images) served at the root: short cache.
    location ~* \.(?:woff2?|ttf|otf|eot|jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never cache HTML, so a redeploy is picked up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths fall back to index.html so deep links
    # like /claims/clm-119640 work on a fresh load or refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
